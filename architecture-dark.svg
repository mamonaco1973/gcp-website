<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="630" viewBox="0 0 1620 630" role="img" aria-label="A browser looks up the domain in a Cloud DNS zone, whose root and www A records point at a global external HTTPS load balancer, and fetches the site over HTTPS on port 443. The load balancer presents a Google-managed certificate for both names, which Google validates once the A records resolve to it, and serves index.html and 404.html from a public Cloud Storage bucket through a backend bucket with Cloud CDN enabled."><defs><marker id="a_e_dns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_https" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_alias" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker><marker id="a_e_cert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_oac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_valid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs><rect width="1620" height="630" fill="#0d1117"/><path d="M600,95.0 H250.0 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_dns)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">DNS lookup</text><path d="M810.0,150 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_https)"/><text x="824.0" y="201.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">HTTPS :443</text><path d="M460,295.0 H595" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_alias)"/><text x="530.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">A record</text><path d="M1160,295.0 H1025" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_cert)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">TLS cert</text><path d="M810.0,350 V435" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_oac)"/><text x="824.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">backend bucket</text><path d="M1370.0,350 V610 H250.0 V355" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_valid)"/><text x="1356.0" y="600" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">validated once DNS points at the LB</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Browser</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">your-domain and www.your-domain</text><rect x="40" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(60,280.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-8a3.5 3.5 0 0 1 0-7H12"/></g><text x="104.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cloud DNS zone</text><text x="104.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">root and www A records</text><rect x="600" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#f2c163" stroke-width="2"/><g transform="translate(620,280.0) scale(1.25)" fill="none" stroke="#f2c163" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></g><text x="664.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">HTTPS load balancer</text><text x="664.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">global IP, :443 only, Cloud CDN</text><rect x="1160" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(1180,280.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g><text x="1224.0" y="291.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Managed certificate</text><text x="1224.0" y="317.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">website-cert: root and www</text><rect x="600" y="440" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><g transform="translate(620,480.0) scale(1.25)" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="664.0" y="491.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cloud Storage bucket</text><text x="664.0" y="517.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">index.html, 404.html, public read</text></svg>